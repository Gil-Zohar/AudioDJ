# AutoDJ tuning. Every weight and threshold the engine uses lives here.
# Secrets and machine-specific paths belong in .env, not this file.

analysis:
  sample_rate: 22050          # analysis rate (render always runs at render.sample_rate)
  hop_length: 512
  beat_tracker: auto          # auto | librosa | madmom  (auto = madmom if importable, else librosa)
  beats_per_bar: 4
  # demucs is markedly better and roughly 1x realtime on 4 CPU threads;
  # hpss is a fast DSP approximation for when you just need something now.
  stem_provider: demucs       # demucs | hpss
  demucs_model: htdemucs
  min_section_bars: 4          # a section shorter than this is not a section
  min_section_seconds: 4.0     # absolute floor, used when the bar length is unknown
  max_sections: 14
  key_profile: temperley      # temperley | krumhansl

matching:
  tempo_tolerance: 0.08       # +/- 8% stretch considered acceptable
  allow_half_double: true     # also try 2x and 0.5x tempo relationships
  allow_three_two: false      # also try 3:2 / 2:3 (polyrhythmic, usually messy)
  max_pitch_shift: 2          # semitones we may shift to fix a key clash
  min_score: 0.45             # below this a pair is never used
  top_n: 20
  # Confidence at or above this is trusted fully; below it the key term fades
  # toward neutral rather than trusting a bad detection. Critical for
  # Mizrahi/maqam material, which does not sit in 12-TET major/minor.
  #
  # Calibrated against 48 real tracks: confidence ran p25 0.049, median 0.115,
  # p95 0.185, max 0.227. The original 0.35 was guessed and trusted NOTHING --
  # the key term could only swing between 0.34 and 0.66, so harmonic mixing was
  # barely affecting the result at all. Set just under the observed median so a
  # typical detection is trusted and only genuinely ambiguous ones fade.
  key_confidence_floor: 0.11
  weights:
    tempo: 0.30
    key: 0.25
    chroma: 0.30
    energy: 0.15
  energy:
    match_tolerance: 0.15     # |dE| under this counts as a clean energy match
    build_target: 0.25        # ideal dE when the planner wants a deliberate build

render:
  sample_rate: 44100
  # auto = rubberband if its executable is on PATH, else a phase-vocoder fallback.
  # rubberband sounds clearly better on drums; install it from breakfastquay.com
  time_stretcher: auto
  channels: 2
  bitrate: "320k"
  max_stretch: 0.12           # drop a track from a set if it needs more than this
  transition_bars: 8
  min_section_bars: 8
  # Gain staging by perceived loudness (ITU-R BS.1770), not by peak. Peak
  # normalisation scales everything by one number, so a quiet track stays quiet
  # next to a loud one; matching LUFS is what a DJ does with trim.
  target_lufs: -14.0          # streaming-style. Use about -9 for a club master
  true_peak_ceiling_db: -1.0  # limiter ceiling
  limiter_release_ms: 120
  normalize_segments: true    # match each track's loudness before it enters
  # Two beat-matched tracks are correlated, so a blend sums in amplitude and
  # runs hot however the fades are shaped. This rides it back down.
  ride_levels: true
  mashup_vocal_gain_db: 1.5
  mashup_instrumental_gain_db: -1.5

transitions:
  default: bass_swap
  enabled: [bass_swap, filter_sweep, echo_out, reverb_tail]
  filter_sweep:
    start_hz: 20000
    end_hz: 400
  echo_out:
    delay_beats: 0.75
    feedback: 0.45
    mix: 0.35
  reverb_tail:
    room_size: 0.8
    wet: 0.4

fx:
  # clean       = no production effects, straight blends
  # club        = sidechain pump, filter builds into transitions, delay throws
  # atmospheric = club, plus a sustained pad across each transition and a
  #               light reverb wash. The pad also glues together tracks whose
  #               styles do not obviously belong side by side.
  style: club
  # Each of these overrides the style preset; leave blank to use the preset.
  sidechain:            # 0..0.95 ducking depth
  pad_gain_db:          # e.g. -19
  filter_build_bars:    # bars of rising high-pass into a transition
  wash:                 # 0..1 reverb send

hype:
  density: light              # off | light | heavy
  lead_beats: 4               # how far before a drop a shout lands
  gain_db: -6.0
  tts_provider: none          # none | (pluggable)

trends:
  israel_weight: 0.7
  global_weight: 0.3
  cache_hours: 6
  max_tracks: 200
  providers: [lastfm, youtube, applemusic]
  fuzzy_match_threshold: 82   # rapidfuzz score required to bind a trend entry to a local file

live:
  lookahead_seconds: 90
  chunk_seconds: 2.0
  trend_refresh_minutes: 30
