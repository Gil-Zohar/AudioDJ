[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autodj"
version = "0.1.0"
description = "Local mashup mixer and live DJ stream for viral tracks"
requires-python = ">=3.11"
dependencies = [
    "numpy<2.3",
    "scipy",
    "librosa>=0.11",
    "soundfile",
    "pyrubberband",
    "pedalboard",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml",
    "mutagen",
    "rapidfuzz",
    "httpx",
]

[project.optional-dependencies]
# Heavy: pulls torch (~2GB). Only needed for real Demucs stem separation.
stems = ["demucs>=4.1"]
dev = ["pytest", "pytest-asyncio", "playwright"]   # playwright drives the UI checks

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::FutureWarning",
]
markers = ["slow: end-to-end renders; deselect with -m 'not slow'"]

[tool.setuptools.packages.find]
include = ["app*"]
