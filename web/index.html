<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoDJ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2714%27 font-size=%2714%27%3E%F0%9F%8E%9B%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Auto<span>DJ</span></h1>
  <span class="muted" id="status">loading…</span>
  <nav class="tabs">
    <button class="tab active" data-view="create">Create</button>
    <button class="tab" data-view="library">Library</button>
    <button class="tab" data-view="mashup">Mashup</button>
    <button class="tab" data-view="trends">Trending</button>
    <button class="tab" data-view="mixes">History</button>
  </nav>
  <span class="muted" style="margin-left:auto">Stage 3 — trends &amp; Create</span>
</header>
<section id="view-create" class="panel"></section>
<section id="view-trends" class="panel" hidden></section>
<main id="view-library" style="display:none">
  <div id="list"><div class="muted" style="padding:14px">scanning…</div></div>
  <div id="detail"><p class="muted">Pick a track on the left.</p></div>
</main>
<section id="view-mashup" class="panel" hidden></section>
<section id="view-mixes" class="panel" hidden></section>
<script src="/app.js"></script>
</body>
</html>
